<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXORA — Official Consumer Electronics & Technology Store</title>
    <meta name="description" content="NEXORA is a premier electronics retailer. Discover and buy official smartphones, laptops, audio gear, gaming hardware, and consumer technology with genuine brand warranties and insured delivery." />
    <meta name="theme-color" content="#123C35" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="http://localhost:3000/" />
    <meta property="og:title" content="NEXORA — Official Consumer Electronics & Technology Store" />
    <meta property="og:description" content="NEXORA is a premier electronics retailer. Discover and buy official smartphones, laptops, audio gear, gaming hardware, and consumer technology with genuine brand warranties and insured delivery." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "http://localhost:3000/#organization",
          "name": "NEXORA",
          "url": "http://localhost:3000/",
          "logo": "http://localhost:3000/favicon.svg",
          "description": "Premier retailer of official consumer electronics, smartphones, laptops, audio, gaming, and consumer technology in India."
        },
        {
          "@type": "WebSite",
          "@id": "http://localhost:3000/#website",
          "url": "http://localhost:3000/",
          "name": "NEXORA",
          "publisher": {
            "@id": "http://localhost:3000/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "http://localhost:3000/#/shop?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body class="bg-[#F7F5F0] text-[#171A19] antialiased selection:bg-[#EDE4D2] selection:text-[#123C35]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
